<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Age Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0D0D0D; /* Charcoal Black */
            --secondary-color: #1A1A1A; /* Dark Gray */
            --accent-color: #00FFFF; /* Electric Cyan */
            --text-color: #FFFFFF;
            --font-primary: 'Poppins', sans-serif;
            --font-secondary: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--primary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background-color: var(--secondary-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 100px rgba(0, 255, 255, 0.1);
            text-align: center;
            max-width: 90%;
            width: 500px;
        }

        .title {
            font-family: var(--font-secondary);
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .inputs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .input-group input {
            width: 80px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            background-color: var(--primary-color);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            color: var(--text-color);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            box-shadow: 0 0 15px var(--accent-color);
        }

        .as-of-date-section {
            margin-bottom: 30px;
        }

        .as-of-date-section label {
            display: block;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        #as-of-date-slider {
            width: 100%;
            cursor: pointer;
        }

        #as-of-date-display {
            display: block;
            margin-top: 10px;
            font-size: 1rem;
            opacity: 0.9;
        }

        #calculate-btn {
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: var(--font-secondary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        #calculate-btn:hover {
            background-color: var(--text-color);
            box-shadow: 0 0 20px var(--accent-color);
        }

        .result {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .age-output {
            background-color: var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .age-output:hover {
            transform: translateY(-5px);
        }

        .age-output span {
            font-size: 2rem;
            font-family: var(--font-secondary);
            color: var(--accent-color);
            display: block;
        }

        .age-output p {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.8;
        }

        .fractional-years-output {
            margin-top: 20px;
            background-color: var(--primary-color);
            padding: 20px;
            border-radius: 10px;
        }

        .fractional-years-output span {
            font-size: 2rem;
            font-family: var(--font-secondary);
            color: var(--accent-color);
        }

        .fractional-years-output p {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .inputs {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .result {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="container">
        <div class="calculator">
            <h1 class="title">Age Calculator</h1>
            <div class="inputs">
                <div class="input-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" placeholder="DD" min="1" max="31">
                </div>
                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" placeholder="MM" min="1" max="12">
                </div>
                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="YYYY" min="1900">
                </div>
            </div>
            <div class="as-of-date-section">
                <label for="as-of-date-slider">As of Date</label>
                <input type="range" id="as-of-date-slider" min="0" max="100" value="50">
                <span id="as-of-date-display"></span>
            </div>
            <button id="calculate-btn">Calculate Age</button>
            <div class="result">
                <div class="age-output">
                    <span id="years-output">--</span>
                    <p>years</p>
                </div>
                <div class="age-output">
                    <span id="months-output">--</span>
                    <p>months</p>
                </div>
                <div class="age-output">
                    <span id="days-output">--</span>
                    <p>days</p>
                </div>
                <div class="age-output">
                    <span id="hours-output">--</span>
                    <p>hours</p>
                </div>
                <div class="age-output">
                    <span id="minutes-output">--</span>
                    <p>minutes</p>
                </div>
                <div class="age-output">
                    <span id="seconds-output">--</span>
                    <p>seconds</p>
                </div>
            </div>
             <div class="fractional-years-output">
                    <span id="fractional-years-output">--</span>
                    <p>fractional years</p>
                </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/2.3.0/luxon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const { DateTime } = luxon;
            const gsap = window.gsap;

            // DOM Elements
            const dayInput = document.getElementById('day');
            const monthInput = document.getElementById('month');
            const yearInput = document.getElementById('year');
            const calculateBtn = document.getElementById('calculate-btn');
            const asOfDateSlider = document.getElementById('as-of-date-slider');
            const asOfDateDisplay = document.getElementById('as-of-date-display');

            const outputs = {
                years: document.getElementById('years-output'),
                months: document.getElementById('months-output'),
                days: document.getElementById('days-output'),
                hours: document.getElementById('hours-output'),
                minutes: document.getElementById('minutes-output'),
                seconds: document.getElementById('seconds-output'),
                fractionalYears: document.getElementById('fractional-years-output'),
            };

            let birthDate;
            let asOfDate = DateTime.now();

            // --- Slider and Date Display ---
            function updateSliderAndDisplay() {
                const now = DateTime.now();
                const oneYearAgo = now.minus({ years: 1 });
                const oneYearHence = now.plus({ years: 1 });

                asOfDateSlider.min = oneYearAgo.toMillis();
                asOfDateSlider.max = oneYearHence.toMillis();
                asOfDateSlider.value = asOfDate.toMillis();
                asOfDateDisplay.textContent = asOfDate.toLocaleString(DateTime.DATETIME_MED);
            }

            function attemptAgeCalculation() {
                const day = parseInt(dayInput.value);
                const month = parseInt(monthInput.value);
                const year = parseInt(yearInput.value);

                if (!day || !month || String(year).length < 4) {
                    return; // Not a complete date, do nothing.
                }

                const tempBirthDate = DateTime.fromObject({ day, month, year });

                if (tempBirthDate.isValid) {
                    birthDate = tempBirthDate;
                    fetchAndDisplayAge();
                }
            }

            // --- Event Listeners ---
            dayInput.addEventListener('input', attemptAgeCalculation);
            monthInput.addEventListener('input', attemptAgeCalculation);
            yearInput.addEventListener('input', attemptAgeCalculation);

            asOfDateSlider.addEventListener('input', () => {
                asOfDate = DateTime.fromMillis(parseInt(asOfDateSlider.value));
                updateSliderAndDisplay();
                if (birthDate && birthDate.isValid) {
                    fetchAndDisplayAge();
                }
            });

            calculateBtn.addEventListener('click', () => {
                gsap.fromTo(calculateBtn, { scale: 1 }, { scale: 1.05, yoyo: true, repeat: 1, duration: 0.2 });
                attemptAgeCalculation();

                const day = parseInt(dayInput.value);
                const month = parseInt(monthInput.value);
                const year = parseInt(yearInput.value);
                const tempBirthDate = DateTime.fromObject({ day, month, year });
                if (!tempBirthDate.isValid) {
                    alert('Please enter a valid birth date.');
                }
            });

            async function fetchAndDisplayAge() {
                if (!birthDate || !birthDate.isValid) return;

                try {
                    const response = await fetch('http://localhost:3000/api/age', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            birthdate: birthDate.toISODate(),
                            as_of_date: asOfDate.toISO(),
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'An error occurred.');
                    }

                    const age = await response.json();
                    updateUI(age);

                } catch (error) {
                    alert(`Error: ${error.message}`);
                }
            }

            function updateUI(age) {
                const timeline = gsap.timeline();

                for (const key in outputs) {
                    if (age.hasOwnProperty(key) && outputs[key]) {
                        const target = { val: parseFloat(outputs[key].textContent) || 0 };
                        const endValue = key === 'fractionalYears' ? parseFloat(age[key]).toFixed(8) : parseInt(age[key]);

                        timeline.to(target, {
                            val: endValue,
                            duration: 1,
                            ease: 'power3.out',
                            onUpdate: () => {
                                 outputs[key].textContent = key === 'fractionalYears' ? parseFloat(target.val).toFixed(8) : Math.round(target.val);
                            },
                        }, "<0.1");
                    }
                }
            }

            // --- Particle Animation ---
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particlesArray;

            const mouse = {
                x: null,
                y: null,
                radius: (canvas.height / 100) * (canvas.width / 100)
            };

            window.addEventListener('mousemove', (event) => {
                mouse.x = event.x;
                mouse.y = event.y;
            });

            class Particle {
                constructor(x, y, directionX, directionY, size, color) {
                    this.x = x;
                    this.y = y;
                    this.directionX = directionX;
                    this.directionY = directionY;
                    this.size = size;
                    this.color = color;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                    ctx.fill();
                }

                update() {
                    if (this.x > canvas.width || this.x < 0) {
                        this.directionX = -this.directionX;
                    }
                    if (this.y > canvas.height || this.y < 0) {
                        this.directionY = -this.directionY;
                    }
                    this.x += this.directionX;
                    this.y += this.directionY;
                    this.draw();
                }
            }

            function initParticles() {
                particlesArray = [];
                let numberOfParticles = (canvas.height * canvas.width) / 9000;
                for (let i = 0; i < numberOfParticles; i++) {
                    let size = (Math.random() * 2) + 1;
                    let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                    let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                    let directionX = (Math.random() * 0.4) - 0.2;
                    let directionY = (Math.random() * 0.4) - 0.2;
                    particlesArray.push(new Particle(x, y, directionX, directionY, size));
                }
            }

            function animateParticles() {
                requestAnimationFrame(animateParticles);
                ctx.clearRect(0, 0, innerWidth, innerHeight);

                for (let i = 0; i < particlesArray.length; i++) {
                    particlesArray[i].update();
                }
            }

            window.addEventListener('resize', () => {
                canvas.width = innerWidth;
                canvas.height = innerHeight;
                mouse.radius = (canvas.height / 100) * (canvas.width / 100);
                initParticles();
            });

            window.addEventListener('mouseout', () => {
                mouse.x = undefined;
                mouse.y = undefined;
            });

            // --- Initial Setup ---
            updateSliderAndDisplay();
            initParticles();
            animateParticles();
        });
    </script>
</body>
</html>
