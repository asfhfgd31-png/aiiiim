<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Age Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <header>
            <h1>Age Calculator</h1>
        </header>
        <div class="input-container">
            <div class="input-group">
                <label for="day">Day</label>
                <input type="number" id="day" placeholder="DD" min="1" max="31">
            </div>
            <div class="input-group">
                <label for="month">Month</label>
                <input type="number" id="month" placeholder="MM" min="1" max="12">
            </div>
            <div class="input-group">
                <label for="year">Year</label>
                <input type="number" id="year" placeholder="YYYY" min="1900">
            </div>
        </div>
        <div class="result-container">
            <div class="age-display">
                <span id="years-result">- -</span>
                <p>years</p>
            </div>
            <div class="age-display">
                <span id="months-result">- -</span>
                <p>months</p>
            </div>
            <div class="age-display">
                <span id="days-result">- -</span>
                <p>days</p>
            </div>
        </div>
        <div class="additional-info">
            <div class="info-card" id="zodiac-card">
                <h2>Zodiac Sign</h2>
                <p id="zodiac-sign">-</p>
            </div>
            <div class="info-card" id="milestone-card">
                <h2>Next Birthday</h2>
                <p id="milestone-countdown">-</p>
            </div>
        </div>
         <div class="expanded-data">
            <h2>Your Age In</h2>
            <div class="data-grid">
                <div class="data-item">
                    <p>Months</p>
                    <span id="total-months">-</span>
                </div>
                <div class="data-item">
                    <p>Weeks</p>
                    <span id="total-weeks">-</span>
                </div>
                <div class="data-item">
                    <p>Days</p>
                    <span id="total-days">-</span>
                </div>
                <div class="data-item">
                    <p>Hours</p>
                    <span id="total-hours">-</span>
                </div>
                <div class="data-item">
                    <p>Minutes</p>
                    <span id="total-minutes">-</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
