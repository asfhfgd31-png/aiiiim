<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="age-calculator-container">
        <div class="card">
            <h1 class="card-title">Age Calculator</h1>
            <div class="input-container">
                <div class="input-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" placeholder="DD" min="1" max="31">
                </div>
                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" placeholder="MM" min="1" max="12">
                </div>
                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="YYYY" min="1900">
                </div>
            </div>
            <div class="button-container">
                <button id="calculate-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-7-7h14"/></svg>
                </button>
            </div>
            <div class="result-container">
                <p><span class="result-years">- -</span> years</p>
                <p><span class="result-months">- -</span> months</p>
                <p><span class="result-days">- -</span> days</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
